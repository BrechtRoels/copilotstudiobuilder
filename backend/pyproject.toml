[project]
name = "copilot-studio-builder"
version = "0.1.0"
description = "GenAI-assisted authoring, visualisation and documentation for Copilot Studio agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.23",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
